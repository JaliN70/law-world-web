<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="法規園區 — 互動式等角微縮世界，六大法規領域總入口" />
    <title>法規園區｜法規微縮世界</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <a href="#list-view" class="skip-link">跳至列表檢視</a>
    <div id="app" class="app">
      <header class="top-bar" role="banner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-title">Tysic工程資訊部｜法規園區</span>
        </div>
        <button type="button" id="btn-toggle-view-top" class="top-list-btn" aria-label="列表檢視">☰ 列表</button>
        <button type="button" id="btn-reduce-motion" class="sr-only-focusable" title="減少動態效果" aria-pressed="false">
          減少動態
        </button>
      </header>

      <main class="main-stage">
        <div id="canvas-wrap" class="canvas-wrap" aria-hidden="false">
          <canvas id="world-canvas" role="img" aria-label="法規園區等角微縮世界地圖，可點選建築"></canvas>
          <div id="labels-layer" class="labels-layer" aria-live="polite"></div>
          <div id="load-fallback" class="load-fallback hidden" role="alert">
            <p>3D 場景載入較久或不受支援。</p>
            <button type="button" id="btn-fallback-list" class="btn-primary">改用列表檢視</button>
          </div>
        </div>

        <aside id="list-view" class="list-view hidden" aria-label="六站列表檢視">
          <h2>六大法規領域</h2>
          <p class="list-hint">可在此瀏覽全部站點，亦為螢幕閱讀器主要導覽路徑。</p>
          <div id="list-cards" class="list-cards"></div>
        </aside>
      </main>

      <footer class="thumb-zone" role="toolbar" aria-label="主要操作">
        <button type="button" id="btn-quests" class="thumb-btn solid">任務 <span id="quest-thumb-count">0/6</span></button>
        <button type="button" id="btn-toggle-view" class="thumb-btn outlined">☰ 列表檢視</button>
      </footer>

      <div id="confirm-card" class="confirm-card hidden" role="dialog" aria-modal="true" aria-labelledby="card-title">
        <div id="card-body" class="card-body"></div>
      </div>

      <div id="tutorial-overlay" class="tutorial-overlay hidden" role="dialog" aria-labelledby="tutorial-title">
        <div id="tutorial-spotlight" class="tutorial-spotlight hidden" aria-hidden="true"></div>
        <div class="tutorial-sheet">
          <p class="tutorial-step" id="tutorial-step-label">教學 1 / 4</p>
          <h2 id="tutorial-title">歡迎來到法規園區</h2>
          <p id="tutorial-text"></p>
          <div class="tutorial-actions">
            <button type="button" id="btn-tutorial-skip" class="btn-outline">略過教學</button>
            <button type="button" id="btn-tutorial-next" class="btn-primary">下一步</button>
          </div>
        </div>
      </div>

      <div id="quest-panel" class="quest-panel hidden" role="dialog" aria-labelledby="quest-title"></div>

      <div id="lesson-sheet" class="lesson-sheet hidden" role="dialog" aria-labelledby="lesson-heading"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
